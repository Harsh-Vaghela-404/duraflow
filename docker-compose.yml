services:
  postgres:
    image: postgres:16-alpine
    container_name: duraflow-postgres
    environment:
      POSTGRES_USER: duraflow
      POSTGRES_PASSWORD: duraflow
      POSTGRES_DB: duraflow
    ports:
      # Host 5433 -> container 5432 (host 5432 is used by another Postgres).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/engine/src/db/init.sql:/docker-entrypoint-initdb.d/01-duraflow-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U duraflow" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duraflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: duraflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
