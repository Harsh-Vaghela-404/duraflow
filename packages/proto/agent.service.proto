syntax = "proto3";

package duraflow;

// Task lifecycle: PENDING → RUNNING → COMPLETED/FAILED/CANCELLED
enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    RUNNING = 2;
    COMPLETED = 3;
    FAILED = 4;
    CANCELLED = 5;
    ROLLED_BACK = 6;
    PARTIAL_ROLLBACK = 7;
}

message SubmitTaskRequest {
    string workflow_name = 1;
    bytes input = 2;  // JSON-encoded
}

message SubmitTaskResponse {
    string task_id = 1;
}

message GetTaskStatusRequest {
    string task_id = 1;
}

message GetTaskStatusResponse {
    TaskStatus status = 1;
    bytes output = 2;  // JSON-encoded
    bytes error = 3;   // JSON-encoded
}

message CancelTaskRequest {
    string task_id = 1;
}

message CancelTaskResponse {
    bool success = 1;  // False if already completed/failed
}

message GetRateLimitStatusRequest {
    string api_name = 1;
}

message GetRateLimitStatusResponse {
    string api_name = 1;
    int64 remaining_tokens = 2;
    int64 capacity = 3;
    int64 rate_per_minute = 4;
    int64 ttl_seconds = 5;
}

message ResetRateLimitRequest {
    string api_name = 1;
}

message ResetRateLimitResponse {
    bool success = 1;
}

// Step operations for memoization and crash recovery
message GetStepRequest {
    string task_id = 1;
    string step_key = 2;
}

message GetStepResponse {
    bool found = 1;
    bool completed = 2;
    bytes output = 3;  // JSON-encoded, only set if completed
}

message CompleteStepRequest {
    string task_id = 1;
    string step_key = 2;
    bytes output = 3;  // JSON-encoded
}

message CompleteStepResponse {
    bool success = 1;
}

message FailStepRequest {
    string task_id = 1;
    string step_key = 2;
    bytes error = 3;  // JSON-encoded
}

message FailStepResponse {
    bool success = 1;
}

// Task queue management
service AgentService {
    rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
    rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
    rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
    rpc GetRateLimitStatus(GetRateLimitStatusRequest) returns (GetRateLimitStatusResponse);
    rpc ResetRateLimit(ResetRateLimitRequest) returns (ResetRateLimitResponse);

    // Step operations for SDK crash recovery
    rpc GetStep(GetStepRequest) returns (GetStepResponse);
    rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);
    rpc FailStep(FailStepRequest) returns (FailStepResponse);
}
